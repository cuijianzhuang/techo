<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手帐后台</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/techo.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="admin">
<!--SYMBOLS-->
<header class="top">
  <h1>手帐后台</h1>
  <span class="who" id="who"></span>
  <a class="home" href="/" target="_blank" rel="noopener">查看主页 ↗</a>
  <button class="b small logout" id="logout" type="button" hidden>退出</button>
</header>
<div class="wrap" id="app">
  <aside class="side">
    <button class="item new" id="newBtn" type="button"><b>＋ 新写一页</b><span id="today"></span></button>
    <button class="item" id="jotsBtn" type="button"><b>随手记</b><span>今晚写成一页草稿</span></button>
    <div class="sect" id="countLabel">已写的页</div>
    <div class="lfind">
      <input type="search" id="q" placeholder="搜标题、正文、日期" aria-label="搜索已写的页" autocomplete="off">
      <div class="lfilter" id="lfilter" role="group" aria-label="按状态筛选"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="sect">设置</div>
    <button class="item" id="settingsBtn" type="button"><b>手帐设置</b><span>标题 · 封面 · 扉页 · 联系方式</span></button>
  </aside>
  <main class="main" id="main">
    <div class="empty-state hand">正在加载……</div>
  </main>
</div>
<div class="gate" id="gate" hidden>
  <div class="gatebox">
    <h2>登录</h2>
    <p id="gateMsg">这个后台只对手帐主人开放。</p>
    <a class="b pri ghbtn" href="/api/auth/github"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>用 GitHub 登录</a>
  </div>
</div>
<script src="/assets/render.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
