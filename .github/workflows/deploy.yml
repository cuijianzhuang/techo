name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # generated pages must match their sources in src-build/
      - run: python3 src-build/build.py && npm run build:3d && git diff --exit-code -- public

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # a new account's first deploy: make the photo bucket and the tables (the D1 database itself is made by hand,
          # `wrangler d1 create`, and its id goes in wrangler.jsonc). Tables only when there are none: a database in
          # use is left to migrations/, and schema.sql never runs over it.
          preCommands: |
            npx wrangler r2 bucket create techo-photos || true
            npx wrangler d1 execute DB --remote --command "SELECT 1 FROM entries LIMIT 1" >/dev/null 2>&1 || npx wrangler d1 execute DB --remote --file=schema.sql
          command: deploy
