<header class="top">
  <h1>手帐后台</h1>

<div class="wrap" id="app">

  <aside class="side">
    <nav class="snav" aria-label="写">
      <button class="item mi" id="homeBtn" type="button" data-ico="home"><b>今天</b><span id="today"></span></button>
      <button class="item mi new" id="newBtn" type="button" data-ico="new"><b>新写一页</b><span>写今天，或补哪一天</span></button>
      <button class="item mi" id="jotsBtn" type="button" data-ico="jots"><b>随手记</b><span>今晚写成一页草稿</span></button>
      <button class="item mi" id="pagesBtn" type="button" data-ico="pages"><b>文章管理</b><span id="pagesSum">搜索 · 筛选 · 批量发布</span></button>
    </nav>
    <div class="sect">最近写的</div>
    <div class="list" id="list"></div>
    <div class="sect">手帐设置</div>
    <nav class="setnav" id="setnav" aria-label="手帐设置"></nav>
  </aside>
  <main class="main" id="main">
    <div class="empty-state hand">正在加载……</div>
  </main>
</div>
