<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>足迹 · Cuijianzhuang 手帐</title>
<meta name="description" content="手帐里写下的每一天，在哪里写的。">
<meta name="theme-color" content="#e8e6e1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500&display=swap">
<!-- Where the diary pages were written: a Mapbox map (手帐设置 → 地图) with a pin for every place, the pins
     close together gathered into one with a count. A pin opens a slip of the journal's paper listing the
     pages written there; each opens the book at that page (/#e-<id>). Filled by /assets/map.js. -->
<style>
:root{
  --desk:#e8e6e1;--desk-ink:#6d6a63;--desk-strong:#2a2724;
  --paper:#fbf8ee;--grid:rgba(128,140,112,.17);--grid-strong:rgba(128,140,112,.3);
  --ink:#2a2724;--ink-soft:#5a544c;--olive:#8a9a2b;--red:#d9573b;--tape:rgba(236,214,150,.72);
  --hand:"Long Cang","Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",cursive;
  --title:"Ma Shan Zheng","Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --latin:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --print:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#1e1f22;--desk-ink:#9c988f;--desk-strong:#ebe6da;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#1e1f22;--desk-ink:#9c988f;--desk-strong:#ebe6da;color-scheme:dark}
/* ☾/☀ (Techo.themeButton), top right */
.theme-sw{position:absolute;top:22px;right:max(16px,calc(50% - 490px));appearance:none;border:0;background:transparent;color:var(--desk-ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.theme-sw:hover{background:rgba(128,128,120,.15)}
.theme-sw:focus-visible{outline:2px solid var(--red);outline-offset:2px}
html,body{margin:0}
body{min-height:100vh;box-sizing:border-box;padding:28px 16px 32px;display:flex;flex-direction:column;
  background-color:var(--desk);color:var(--ink);font:400 15px/1.6 var(--print);
  background-image:repeating-linear-gradient(0deg,rgba(120,110,90,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,110,90,.03) 0 1px,transparent 1px 4px)}
a{color:inherit}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:3px}

.mp-top,.mp-frame{width:100%;max-width:980px;margin:0 auto}
.mp-back{display:inline-block;padding:4px 0;margin-right:14px;color:var(--desk-ink);font:400 13px/1 var(--print);text-decoration:none}
.mp-back:hover{text-decoration:underline;text-underline-offset:3px}
h1{margin:18px 0 0;color:var(--desk-strong);font:400 46px/1 var(--title);letter-spacing:3px}
.mp-sub{margin:4px 0 0;color:var(--desk-ink);font:500 21px/1.1 var(--latin)}
.mp-stat{margin:10px 0 14px;min-height:1.5em;color:var(--desk-ink);font:400 12.5px/1.5 var(--print);font-variant-numeric:tabular-nums}

/* the map, taped onto the desk like a big photo */
.mp-frame{position:relative;flex:1;min-height:420px;display:flex;padding:8px;box-sizing:border-box;background:#fff;
  box-shadow:0 1px 2px rgba(40,30,10,.16),0 10px 26px rgba(40,30,10,.14);border-radius:3px}
.mp-frame::before,.mp-frame::after{content:"";position:absolute;top:-10px;width:80px;height:20px;background:var(--tape);z-index:2}
.mp-frame::before{left:40px;transform:rotate(-4deg)}
.mp-frame::after{right:40px;transform:rotate(3deg)}
#map{flex:1;min-height:400px;border-radius:2px;background:#e9e4d6}
.mp-msg{margin:auto;padding:40px 20px;color:var(--desk-ink);font:400 20px/1.5 var(--hand);text-align:center}
.mp-msg a{color:var(--olive)}

/* a pin's slip: the pages written there */
.mapboxgl-popup-content{padding:12px 14px 10px!important;border-radius:3px!important;background-color:var(--paper)!important;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)!important;background-size:14px 14px!important;
  box-shadow:0 1px 2px rgba(40,30,10,.18),0 8px 22px rgba(40,30,10,.22)!important;color:var(--ink);font:400 13px/1.4 var(--print);max-width:260px}
.mapboxgl-popup-close-button{font-size:18px;color:var(--ink-soft);padding:2px 7px}
.mp-place{margin:0 18px 6px 0;color:var(--olive);font:500 12px/1.3 var(--print)}
.mp-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:240px;overflow:auto}
.mp-list a{display:block;text-decoration:none;padding:4px 6px;margin:0 -6px;border-radius:3px}
.mp-list a:hover{background:rgba(236,214,150,.35)}
.mp-list b{display:block;font:400 20px/1.2 var(--title);color:var(--ink)}
.mp-list span{color:var(--ink-soft);font:400 11.5px/1.4 var(--print);font-variant-numeric:tabular-nums}

@media (max-width:520px){
  h1{font-size:40px}
  .mp-frame{padding:5px;min-height:60vh}
}
</style>
</head>
<body>
<header class="mp-top">
  <a class="mp-back" href="/">← 回到手帐</a><a class="mp-back" href="/timeline/">时间线</a><a class="mp-back" href="/shelf/">书架</a><a class="mp-back" href="/tickets/">票夹</a><a class="mp-back" href="/bills/">账本</a>
  <h1>足迹</h1>
  <p class="mp-sub">where I wrote it down</p>
  <p class="mp-stat" id="stat"></p>
</header>
<main class="mp-frame"><div id="map" role="region" aria-label="足迹地图"><p class="mp-msg">正在摊开地图……</p></div></main>
<script src="/assets/render.js?v=911cea7f40"></script>
<script src="/assets/map.js?v=5c2cedf4c8"></script>
</body>
</html>
